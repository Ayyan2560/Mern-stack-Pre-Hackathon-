$kind: http-request
url: "{{baseUrl}}/api/profile/change-password"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "Password123",
      "newPassword": "NewPassword123"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
